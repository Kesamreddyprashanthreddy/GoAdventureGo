# render.yaml - Backend Only (Frontend deployed to Netlify)
services:
  # Backend API Service
  - type: web
    name: goadventurego-api
    runtime: node
    plan: free
    rootDir: ./server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        value: your_mongodb_connection_string_here
      - key: JWT_SECRET
        value: your_secure_jwt_secret_here
      - key: JWT_EXPIRE
        value: 7d
      - key: JWT_COOKIE_EXPIRE
        value: 7
      - key: CORS_ORIGIN
        value: "*"
      - key: CLIENT_URL
        value: https://your-netlify-url.netlify.app
